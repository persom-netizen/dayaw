name: dayaw_frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.1
  intl: ^0.19.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  dio: ^5.3.0              # ✅ NEW - Better file upload support
  path_provider: ^2.1.0    # ✅ NEW - For file path handling
  google_fonts: ^6.1.0     # ✅ NEW - For Playfair Display and Inter fonts
  smooth_page_indicator: ^1.1.0  # ✅ NEW - For onboarding page indicators
  tflite_v2: ^1.0.0
  camera: ^0.11.3+1
  permission_handler: ^12.0.1
  path: ^1.8.3
  tflite_flutter: ^0.10.1
  flutter_vision: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pasukin.png
    - assets/rehistro.png
    - assets/logo_yellow.png
    - assets/logo_blue.png
    - assets/login.gif
    - assets/bg.gif
    - assets/page1.gif
    - assets/page2.gif
    - assets/page3.gif
    - assets/page4.gif
    - assets/model.tflite
    - assets/label.txt

  fonts:
    - family: Fortalesia
      fonts:
        - asset: assets/fonts/FortalesiaPlain.otf